name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v6

      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        id: login-registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/ahobsonsayers/twickets-key-extractor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true