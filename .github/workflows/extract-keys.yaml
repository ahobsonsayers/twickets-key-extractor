name: Extract Keys

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_run:
    workflows: ['Build & Push Docker Image']
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  extract:
    name: Extract Keys
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          ls -la /dev/kvm || sudo apt-get update && sudo apt-get install -y --no-install-recommends cpu-checker
          sudo chmod 666 /dev/kvm

      - name: Run container
        run: |
          mkdir -p output
          docker run -d --name twickets-key-extractor \
            --device /dev/kvm --privileged \
            -e GPLAYDL_CONFIG="$GPLAYDL_CONFIG" \
            -v "$PWD/output:/data/output" \
            ghcr.io/ahobsonsayers/twickets-key-extractor:latest
        env:
          GPLAYDL_CONFIG: ${{ secrets.GPLAYDL_CONFIG }}

      - name: Wait for keys
        run: |
          i=1
          while [ "$i" -le 90 ]; do
            if [ -f output/keys.json ]; then
              echo "KEYS CAPTURED"; break
            fi

            if [ -f output/render-failed.txt ]; then
              echo "RENDER FAILED: $(cat output/render-failed.txt)"
              echo "The app's own requests were rejected — possible IP/keybox block (see AGENTS.md/LEARNINGS.md). Do not re-run to retry."
              docker logs twickets-key-extractor | tail -n 80
              exit 1
            fi

            if ! docker ps --format '{{.Names}}' | grep -q twickets-key-extractor; then
              echo "CONTAINER DIED"; docker logs twickets-key-extractor; exit 1
            fi

            if [ "$i" -gt 6 ] && ! docker exec twickets-key-extractor pgrep -f 'first-boot.sh' > /dev/null; then
              echo "FIRST-BOOT DIED (container still up)"; docker logs twickets-key-extractor | tail -n 80; exit 1
            fi

            sleep 20
            i=$((i+1))
          done

          [ -f output/keys.json ] || { echo "keys.json not produced"; docker logs twickets-key-extractor; exit 1; }

      - name: Echo output
        run: |
          echo "=== container logs ==="
          docker logs twickets-key-extractor

      - name: Update gist
        if: vars.GIST_ID != ''
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "GIST_TOKEN secret not set; skipping gist update"
            exit 0
          fi
          jq -n --slurpfile k output/keys.json \
            --arg f 'keys.json' \
            '{"files": {($f): {"content": ($k[0] | tojson)}}}' > gist-payload.json
          curl -fsSL -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @gist-payload.json
          echo "Gist $GIST_ID updated with latest keys"
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}

      - name: Clean up
        if: always()
        run: docker rm -f twickets-key-extractor || true