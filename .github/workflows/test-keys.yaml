name: Test Keys

on:
  workflow_dispatch:

permissions:
  contents: read
      
jobs:
  test:
    name: Test Keys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull keys
        id: pull-keys
        run: |
          if [ -z "$GIST_OWNER" ] || [ -z "$GIST_ID" ]; then
            echo "GIST_OWNER / GIST_ID vars not configured"; exit 1
          fi

          mkdir -p output
          curl -fsSL "https://gist.githubusercontent.com/$GIST_OWNER/$GIST_ID/raw/keys.json" > output/keys.json
          echo "=== keys.json ==="
          cat output/keys.json

          jq -e '.attest.key_pem' output/keys.json > /dev/null \
            || { echo "keys.json has no attest section — did the Extract Keys run's attest extraction (04) fail?"; exit 1; }

        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_OWNER: ${{ vars.GIST_OWNER }}

      - name: Single signed catalogue request
        id: signed-catalogue-request
        run: |
          uv run \
            --with curl-cffi \
            --with cryptography \
            python3 examples/replay-catalogue.py output/keys.json