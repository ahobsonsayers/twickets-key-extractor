name: Test Keys (manual)

# Manual-only off-device signing test. Pulls the keys.json published by the
# daily Extract Keys run from the gist (4 catalogue keys + attest section)
# and fires exactly ONE signed catalogue request from the runner, printing
# the full JSON response. No emulator, no Android — pure off-device signing.
# Needs one daily run to have published the file first.
# Read AGENTS.md before dispatching: one request per dispatch, never twice.

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Keys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v6

      - name: Pull published keys from gist
        id: pull-published-keys
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "GIST_TOKEN secret / GIST_ID var not configured"; exit 1
          fi

          curl -fsSL -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" > gist.json

          mkdir -p output
          jq -e '.files["keys.json"].content' gist.json > /dev/null \
            || { echo "gist has no keys.json — has the daily Extract Keys run published it?"; exit 1; }
          jq '.files["keys.json"].content | fromjson' gist.json > output/keys.json
          echo "=== keys.json ==="
          cat output/keys.json
          jq -e '.attest.key_pem' output/keys.json > /dev/null \
            || { echo "keys.json has no attest section — did the Extract Keys run's attest extraction (04) fail?"; exit 1; }

      - name: Single signed catalogue request
        id: signed-catalogue-request
        run: |
          uv run --with curl-cffi --with cryptography \
            python3 examples/replay-catalogue.py output/keys.json