name: Test Keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Keys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull keys
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "GIST_TOKEN secret not configured"; exit 1
          fi

          curl -fsSL \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" > gist.json

          mkdir -p output
          curl -fsSL "$(jq -r '.files["keys.json"].raw_url' gist.json)" > output/keys.json
          echo "=== keys.json ==="
          cat output/keys.json

          jq -e '.attest.key_pem' output/keys.json > /dev/null \
            || { echo ""; echo "keys.json has no attest section — did the Extract Keys run's attest extraction (04) fail?"; exit 1; }
        env:
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Single signed catalogue request
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv run \
            --with curl-cffi \
            --with cryptography \
            python3 examples/replay-catalogue.py output/keys.json